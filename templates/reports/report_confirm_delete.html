{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h1 style="font-size:1.6rem">Delete this report?</h1>
  <p>"<b>{{ object.title }}</b>" and its {{ object.evidence.count }} evidence file(s), votes and comments will be permanently deleted.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-primary">Yes, delete</button>
    <a class="btn btn-ghost" href="{{ object.get_absolute_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
